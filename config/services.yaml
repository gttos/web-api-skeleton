# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    route.requirements.id: '[0-9]+'
    route.requirements.provider: '[a-z\-\_0-9]+'
    route.requirements.slug: '[a-z\-\_0-9]+'
    route.requirements.type: '[a-z\-\_0-9]+'
    route.requirements.uuid: '([a-fA-F0-9]{8}-(?:[a-fA-F0-9]{4}-){3}[a-fA-F0-9]{12}){1}'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    #
    # Custom monolog line formatters
    #

    monolog.formatter.default:
        class: Monolog\Formatter\LineFormatter
        arguments:
            $format:                     "%%channel%%.%%level_name%%: %%message%% %%context%%\n"
            $allowInlineLineBreaks:      true
            $ignoreEmptyContextAndExtra: true

    monolog.formatter.syslog:
        class: Monolog\Formatter\LineFormatter
        arguments:
            $format:                     "[%%extra.request_id%%] %%channel%%.%%level_name%%: %%message%% %%context%%\n"
            $allowInlineLineBreaks:      true
            $ignoreEmptyContextAndExtra: true

    monolog.formatter.json:
        class: Monolog\Formatter\JsonFormatter

    #
    # Allow injecting service container in Doctrine Migrations
    #
    Doctrine\Migrations\Version\DbalMigrationFactory:

    #
    # App Services that need container resolution
    #

    App\Delivery\Api\:
        resource: '../src/Delivery/Api'
        tags: ['controller.service_arguments']

    App\Delivery\Console\:
        resource: '../src/Delivery/Console'
        tags: ['console.command']

    App\Domain\Services\:
        resource: '../src/Domain/Services'
        public: true

    App\Application\CommandHandlers\:
        resource: '../src/Application/CommandHandlers/*'
        tags: [{ name: messenger.message_handler, bus: command.bus }]

    App\Application\QueryHandlers\:
        resource: '../src/Application/QueryHandlers/*'
        tags: [{ name: messenger.message_handler, bus: query.bus }]

    App\Infrastructure\Persistence\Repositories\:
        resource: '../src/Infrastructure/Persistence/Repositories/*'

    # Add repository interface mappings here to provide an implementation for a repository
    #App\Domain\Services\Repositories\MyModelRepository:
    #    alias:  App\Infrastructure\Persistence\Repositories\MyModelRepository
    #    public: true

    # Event Sourcing Lab — Bounded Contexts
    App\Application\Order\:
        resource: '../src/Application/Order'

    App\Application\Payment\:
        resource: '../src/Application/Payment'

    App\Application\Stock\:
        resource: '../src/Application/Stock'

    App\Application\Notification\:
        resource: '../src/Application/Notification'

    App\Application\Audit\:
        resource: '../src/Application/Audit'

    App\Application\Payment\CommandHandlers\:
        resource: '../src/Application/Payment/CommandHandlers/*'
        tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\Application\Stock\CommandHandlers\:
        resource: '../src/Application/Stock/CommandHandlers/*'
        tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\Application\Notification\CommandHandlers\:
        resource: '../src/Application/Notification/CommandHandlers/*'
        tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\Application\Audit\CommandHandlers\:
        resource: '../src/Application/Audit/CommandHandlers/*'
        tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\Infrastructure\EventStore\:
        resource: '../src/Infrastructure/EventStore'

    App\Infrastructure\EventStore\Upcasting\UpcasterChain:
        arguments:
            $upcasters:
                - '@App\Infrastructure\EventStore\Upcasting\Upcasters\OrderCreatedV1ToV2Upcaster'

    App\Infrastructure\EventStore\DbalEventStore:
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $upcasterChain: '@App\Infrastructure\EventStore\Upcasting\UpcasterChain'

    App\Infrastructure\EventStore\EventStoreInterface:
        alias: App\Infrastructure\EventStore\DbalEventStore
        public: true

    App\Infrastructure\EventStore\SnapshotStoreInterface:
        alias: App\Infrastructure\EventStore\SnapshotStore
        public: true

    App\Domain\Order\Services\OrderServiceInterface:
        alias: App\Application\Order\OrderService
        public: true

    App\Domain\Order\Services\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\Order\DbalOrderRepository
        public: true

    App\Infrastructure\Persistence\Order\DbalOrderRepository:
        arguments:
            $eventStore: '@App\Infrastructure\EventStore\EventStoreInterface'
            $snapshotStore: '@App\Infrastructure\EventStore\SnapshotStoreInterface'

    App\Infrastructure\Outbox\:
        resource: '../src/Infrastructure/Outbox'

    App\Infrastructure\Projection\:
        resource: '../src/Infrastructure/Projection'

    App\Infrastructure\Projection\ProjectionEngine:
        arguments:
            $projectors: !tagged_iterator app.projector

    App\Infrastructure\Messaging\:
        resource: '../src/Infrastructure/Messaging'

    App\Infrastructure\DeadLetter\:
        resource: '../src/Infrastructure/DeadLetter'

    App\Infrastructure\DeadLetter\DeadLetterStoreInterface:
        alias: App\Infrastructure\DeadLetter\DeadLetterStore
        public: true

    App\Infrastructure\DeadLetter\DeadLetterSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    App\Infrastructure\Observability\:
        resource: '../src/Infrastructure/Observability'

    App\Infrastructure\ErrorInjection\:
        resource: '../src/Infrastructure/ErrorInjection'

    redis.client:
        class: Predis\Client
        arguments:
            - '%env(REDIS_URL)%'

    App\Infrastructure\ErrorInjection\ErrorFlagStoreInterface:
        alias: App\Infrastructure\ErrorInjection\RedisErrorFlagStore
        public: true

    App\Infrastructure\ErrorInjection\RedisErrorFlagStore:
        arguments:
            $redis: '@redis.client'

when@dev: &dev
    services:
        App\Resources\Fixtures\:
            resource: '../tests/Support/Fixtures'
            tags: [ 'doctrine.fixture.orm' ]

when@test: *dev
