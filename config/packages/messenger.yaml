framework:
    messenger:
        failure_transport: failed
        default_bus: command.bus

        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: { }

        buses:
            command.bus:
                middleware:
                    - doctrine_transaction

            query.bus:
                middleware:
            event.bus:
                middleware:
            job.queue:
                middleware:

        transports:
            # Transport para integration events del Order Context
            order_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: order_events
                        type: fanout
                    queues:
                        payment_consumer: { binding_keys: [] }
                        stock_consumer: { binding_keys: [] }
                        notification_consumer: { binding_keys: [] }
                        audit_consumer: { binding_keys: [] }
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
                    max_delay: 30000

            # Transport para comandos asíncronos al Stock Context
            stock_commands:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: stock_commands
                        type: direct
                    queues:
                        stock_command_queue: { binding_keys: ['stock'] }
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
                    max_delay: 30000

            # Domain events (mantener el existente)
            domain_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: domain_events
                        type: fanout

            # Job queue (mantener el existente)
            job_queue:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: job_queue
                        type: fanout

            # Failure transport (doctrine, para dead letters)
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            Somnambulist\Components\Events\AbstractEvent: domain_events
            Somnambulist\Components\Jobs\AbstractJob: job_queue
            Somnambulist\Components\Commands\AbstractCommand: sync
            Somnambulist\Components\Queries\AbstractQuery: sync

            App\Domain\Order\Events\OrderCreatedIntegration: order_events
            App\Domain\Payment\Events\PaymentSucceeded: order_events
            App\Domain\Payment\Events\PaymentFailed: order_events
            App\Domain\Stock\Events\StockReserved: order_events
            App\Domain\Stock\Events\StockReservationFailed: order_events
            App\Domain\Notification\Events\NotificationSent: order_events
            App\Domain\Notification\Events\NotificationFailed: order_events
